# Netlify configuration for Swastik Eye & Dental Care

[build]
  command = "npm run build"
  publish = "dist"

# Single-page-app routing: serve index.html for any path so client-side
# routes (/about, /contact, /ayushman) work on direct visit or refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
